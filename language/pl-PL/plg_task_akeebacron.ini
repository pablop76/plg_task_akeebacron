PLG_TASK_AKEEBACRON="Zadanie - Akeeba Backup (cron)"
PLG_TASK_AKEEBACRON_XML_DESCRIPTION="Uruchamia profile Akeeba Backup z poziomu planowanych zadań Joomla."

PLG_TASK_AKEEBACRON_BACKUP_TITLE="Akeeba Backup: wykonaj kopię"
PLG_TASK_AKEEBACRON_BACKUP_DESC="Wykonuje kopię zapasową wybranym profilem Akeeba Backup. Długie kopie dzielone są na kilka przebiegów."

PLG_TASK_AKEEBACRON_BACKUP_PROFILE_LABEL="Profil kopii"
PLG_TASK_AKEEBACRON_BACKUP_PROFILE_DESC="Profil Akeeba Backup, który ma zostać uruchomiony. Jego własne ustawienia decydują o zakresie kopii, miejscu zapisu archiwum i powiadomieniach."
PLG_TASK_AKEEBACRON_BACKUP_FRESHNESS_LABEL="Kiedy wykonywać kopię"
PLG_TASK_AKEEBACRON_BACKUP_FRESHNESS_DESC="Zadanie może pomijać kopię, jeżeli poprzednia jest jeszcze wystarczająco świeża. Dzięki temu harmonogram można ustawić gęściej, niż wynosi wymagana częstotliwość kopii, a nieudany przebieg zostanie nadrobiony przy najbliższej okazji."
PLG_TASK_AKEEBACRON_BACKUP_FRESHNESS_QUICKICON="Gdy Akeeba zacznie przypominać o kopii (próg z wtyczki quickicon)"
PLG_TASK_AKEEBACRON_BACKUP_FRESHNESS_CUSTOM="Gdy ostatnia kopia jest starsza niż podany czas"
PLG_TASK_AKEEBACRON_BACKUP_FRESHNESS_ALWAYS="Przy każdym uruchomieniu zadania"
PLG_TASK_AKEEBACRON_BACKUP_MAXAGE_LABEL="Dopuszczalny wiek ostatniej kopii (godziny)"
PLG_TASK_AKEEBACRON_BACKUP_MAXAGE_DESC="Kopia zostanie wykonana dopiero wtedy, gdy najnowsza ukończona kopia będzie starsza niż tyle godzin."
PLG_TASK_AKEEBACRON_BACKUP_DESCRIPTION_LABEL="Opis kopii"
PLG_TASK_AKEEBACRON_BACKUP_DESCRIPTION_DESC="Widoczny na liście kopii zapasowych. Puste pole oznacza opis domyślny Akeeba Backup."
PLG_TASK_AKEEBACRON_BACKUP_TIMELIMIT_LABEL="Limit czasu jednego przebiegu (sekundy)"
PLG_TASK_AKEEBACRON_BACKUP_TIMELIMIT_DESC="Po tylu sekundach zadanie przerywa pracę i wznawia kopię przy kolejnym uruchomieniu. Wartość 0 wykonuje całą kopię w jednym przebiegu, co jest bezpieczne wyłącznie przy zadaniu cron uruchamianym z wiersza poleceń."
