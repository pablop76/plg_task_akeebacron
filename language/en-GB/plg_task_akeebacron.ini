; Note : All ini files need to be saved as UTF-8

PLG_TASK_AKEEBACRON="Task - Akeeba Backup (cron)"
PLG_TASK_AKEEBACRON_XML_DESCRIPTION="Runs Akeeba Backup profiles from Joomla's Scheduled Tasks."

PLG_TASK_AKEEBACRON_BACKUP_TITLE="Akeeba Backup: take a backup"
PLG_TASK_AKEEBACRON_BACKUP_DESC="Takes a backup with the selected Akeeba Backup profile. Long backups are split over several runs."

PLG_TASK_AKEEBACRON_BACKUP_PROFILE_LABEL="Backup profile"
PLG_TASK_AKEEBACRON_BACKUP_PROFILE_DESC="The Akeeba Backup profile to run. Its own settings decide what is backed up, where the archive goes and who gets notified."
PLG_TASK_AKEEBACRON_BACKUP_FRESHNESS_LABEL="When to take a backup"
PLG_TASK_AKEEBACRON_BACKUP_FRESHNESS_DESC="The task can skip the backup while the previous one is still fresh enough. That lets you schedule it more often than backups are actually needed, so a missed run is caught up at the next opportunity."
PLG_TASK_AKEEBACRON_BACKUP_FRESHNESS_QUICKICON="When Akeeba starts asking for a backup (threshold from its quick icon plugin)"
PLG_TASK_AKEEBACRON_BACKUP_FRESHNESS_CUSTOM="When the last backup is older than the time below"
PLG_TASK_AKEEBACRON_BACKUP_FRESHNESS_ALWAYS="Every time the task runs"
PLG_TASK_AKEEBACRON_BACKUP_MAXAGE_LABEL="Acceptable age of the last backup (hours)"
PLG_TASK_AKEEBACRON_BACKUP_MAXAGE_DESC="A backup is only taken once the newest complete backup is older than this many hours."
PLG_TASK_AKEEBACRON_BACKUP_DESCRIPTION_LABEL="Backup description"
PLG_TASK_AKEEBACRON_BACKUP_DESCRIPTION_DESC="Shown in Manage Backups. Leave empty to use the Akeeba Backup default."
PLG_TASK_AKEEBACRON_BACKUP_TIMELIMIT_LABEL="Time budget per run (seconds)"
PLG_TASK_AKEEBACRON_BACKUP_TIMELIMIT_DESC="Stop after this many seconds and resume the backup on the next run of the task. Use 0 to run the whole backup in one go, which is only safe with a real CLI cron job."
